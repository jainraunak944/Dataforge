name: Deploy artifact to GitHub Pages

# Publishes the built explainer as the public no-sign-in artifact URL.
# Requires (one-time, repo owner): Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/memory-under-pressure-p6vp89
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Project pages serve from /<repo>/ — the app reads BASE_PATH at build time.
      - run: BASE_PATH=/${{ github.event.repository.name }}/ npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tries to enable Pages via the workflow token. While the repository is
      # private this fails (Pages unavailable) — in that case the job exits
      # green with a notice instead of a red run + failure email, and deploys
      # automatically on the next push once the repo is public / Pages enabled.
      - name: Enable or detect GitHub Pages
        id: enable
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy
        if: steps.enable.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Pages not available yet — skipping deploy
        if: steps.enable.outcome != 'success'
        run: |
          echo "::notice::GitHub Pages is not available yet (repository is likely still private). Complete gates G1-G2 in submission/SUBMISSION_CHECKLIST.md — make the repo public, then re-run this workflow or push any commit."
