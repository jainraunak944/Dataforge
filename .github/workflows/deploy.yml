name: Deploy artifact to GitHub Pages

# Publishes the built explainer as the public no-sign-in artifact URL.
# Requires (one-time, repo owner): Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches:
      - claude/memory-under-pressure-p6vp89
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Project pages serve from /<repo>/ — the app reads BASE_PATH at build time.
      - run: BASE_PATH=/${{ github.event.repository.name }}/ npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Tries to enable Pages via the workflow token; if the token may not,
      # the one-time manual step is Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
